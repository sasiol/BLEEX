name: Android CI

on:
  push:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up JDK
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '11'

        - name: Make gradlew executable
          run: chmod +x ./gradlew

        - name: Run unit tests
          run: ./gradlew test
