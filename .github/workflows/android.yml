name: Android CI

on:
  push:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up JDK
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '11'

        - name: Make gradlew executable
          run: chmod +x ./gradlew

        - name: Run unit tests
          run: ./gradlew test

        - name: Publish test results
          if: always()
          uses: dorny/test-reporter@v2
          with:
              name: Unit Tests
              path: app/build/test-results/testDebugUnitTest/*.xml
              reporter: java-junit

        - name: SECURITY:Run Android lint
          run: ./gradlew lint

        - name: SECURITY:Run Trivy scan
          uses: aquasecurity/trivy-action@v0.36.0
          with:
              scan-type: 'fs'
              scan-ref: '.'
              severity: 'HIGH,CRITICAL'
              exit-code: '1'
              ignore-unfixed: true
